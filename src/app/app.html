<div class="container">
  <h1>Магазин на Kaspi</h1>

  <div class="product-list">
    @for (product of productList; track product.id) {
      <div class="card">
        <img [src]="product.image" [alt]="product.name">
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <div class="info">
          <span>Рейтинг: {{ product.rating }} ⭐</span>
          <strong>Цена: {{ product.price }} ₸</strong>
        </div>
        <div class="buttons">
          <a [href]="product.link" target="_blank" class="buy-btn">Купить</a>
          <button (click)="share(product.link)" class="share-btn">TG Share</button>
        </div>
      </div>
    }

  </div>
</div>
